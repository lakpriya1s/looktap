# Build looktap's Wi-Fi keeper (native/android-wifi), the app `looktap wifi --always` installs on an Android phone.
# Each build signs it with a key made in that run and deleted when it ends: no signing key exists anywhere else.
# On main it's published as the GitHub release keeper-v<versionCode>, which looktap downloads (lib/wifi.js
# KEEPER_VERSION); a release that already exists is left as it is. Pull requests just build it, as an artifact.
name: Wi-Fi keeper

on:
  push:
    branches: [main]
    paths: ['native/android-wifi/**', '.github/workflows/keeper.yml']
  pull_request:
    paths: ['native/android-wifi/**', '.github/workflows/keeper.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: native/android-wifi/build.sh
      - id: version
        run: echo "code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' native/android-wifi/AndroidManifest.xml)" >> "$GITHUB_OUTPUT"
      - run: grep -q "KEEPER_VERSION = ${{ steps.version.outputs.code }};" lib/wifi.js || { echo "lib/wifi.js KEEPER_VERSION doesn't match versionCode ${{ steps.version.outputs.code }}"; exit 1; }
      - run: sha256sum native/android-wifi/build/looktap-wifi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: looktap-wifi-${{ steps.version.outputs.code }}
          path: native/android-wifi/build/looktap-wifi.apk
      - name: Publish keeper-v${{ steps.version.outputs.code }}
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: keeper-v${{ steps.version.outputs.code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already published; bump versionCode to publish a new keeper"; exit 0; fi
          gh release create "$TAG" native/android-wifi/build/looktap-wifi.apk --target "$GITHUB_SHA" --latest=false \
            --title "Wi-Fi keeper $TAG" \
            --notes "The Android app \`looktap wifi --always\` downloads and installs: it keeps Wireless debugging on after restarts and on rejoining Wi-Fi. Built and signed by GitHub Actions with a key made for this build and then deleted. Not a looktap release."
