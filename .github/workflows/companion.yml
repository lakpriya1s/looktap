# Build looktap runner for Android (native/android-app), the app `looktap runner install` puts on an Android phone.
# Each build signs it with a key made in that run and deleted when it ends: no signing key exists anywhere else.
# On main it's published as the GitHub release app-v<versionCode>, which looktap downloads (lib/companion.js
# COMPANION_VERSION); a release that already exists is left as it is. Pull requests just build it, as an artifact.
name: looktap runner for Android

on:
  push:
    branches: [main]
    paths: ['native/android-app/**', 'native/ios-device/LooktapRunner/Icon/**', '.github/workflows/companion.yml']
  pull_request:
    paths: ['native/android-app/**', 'native/ios-device/LooktapRunner/Icon/**', '.github/workflows/companion.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: native/android-app/build.sh
      - id: version
        run: echo "code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' native/android-app/AndroidManifest.xml)" >> "$GITHUB_OUTPUT"
      - run: grep -q "COMPANION_VERSION = ${{ steps.version.outputs.code }};" lib/companion.js || { echo "lib/companion.js COMPANION_VERSION doesn't match versionCode ${{ steps.version.outputs.code }}"; exit 1; }
      - run: sha256sum native/android-app/build/looktap-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: looktap-app-${{ steps.version.outputs.code }}
          path: native/android-app/build/looktap-app.apk
      - name: Publish app-v${{ steps.version.outputs.code }}
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v${{ steps.version.outputs.code }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG is already published; bump versionCode to publish a new app"; exit 0; fi
          gh release create "$TAG" native/android-app/build/looktap-app.apk --target "$GITHUB_SHA" --latest=false \
            --title "looktap runner for Android $TAG" \
            --notes "The Android app \`looktap runner install\` downloads and installs: a screen showing what looktap does on the phone, with switches to pause it and to show touches. Built and signed by GitHub Actions with a key made for this build and then deleted. Not a looktap release."
