# Build the website (site/build.mjs: landing page + docs generated from README, SKILL.md, BENCHMARK.md)
# and publish it with GitHub Pages. The build fails if the docs or the landing page fall behind the code.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'README.md', 'BENCHMARK.md', 'skills/**', 'bin/**', 'lib/mcp.js', 'assets/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
